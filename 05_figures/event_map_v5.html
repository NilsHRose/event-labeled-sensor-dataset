const COLORS = {"wildfire": "#e6550d", "dust_storm": "#c7a13a", "heatwave": "#d62728", "fireworks": "#9467bd", "festival": "#2ca02c", "oktoberfest": "#2ca02c", "christmas_market": "#17becf", "football_match": "#1f77b4", "football_tournament": "#1f77b4", "football_final": "#1f77b4", "olympics_football": "#1f77b4", "public_holiday": "#7f7f7f", "religious_holiday": "#7f7f7f", "atmospheric_river": "#3182bd", "festival/market": "#2ca02c", "football": "#1f77b4", "holiday": "#7f7f7f", "transport": "#8c564b"};
const DEFCOL = "#8c564b";

const map = L.map('map').setView([45,-30], 3);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {attribution:'&copy; OpenStreetMap'}).addTo(map);

const sensorLayer = L.layerGroup().addTo(map);
STATIONS.forEach(s => {
  L.circleMarker([s.lat,s.lon],{radius:2.5,color:'#555',weight:1,
    fillColor:'#999',fillOpacity:.7})
   .bindPopup(`<b>Sensor</b> ${s.id}<br>${s.region}`).addTo(sensorLayer);
});

function mkCheck(div, values, name){
  const el = document.getElementById(div);
  values.forEach(v=>{
    const c = COLORS[v] || null;
    el.insertAdjacentHTML('beforeend',
      `<label>${c?`<span class="sw" style="background:${c}"></span>`:''}
       <input type="checkbox" class="${name}" value="${v}" checked> ${v}</label>`);
  });
}
mkCheck('fyear', ["2021", "2022", "2023", "2024", "2025", "2026"], 'fy');
mkCheck('ftier', ["1", "2", "3"], 'ft');
mkCheck('ftype', ["atmospheric_river", "dust_storm", "festival/market", "fireworks", "football", "heatwave", "holiday", "transport", "wildfire"], 'fg');
mkCheck('fregion', ["EU", "Global", "US"], 'fr');

const evLayer = L.layerGroup().addTo(map);
const labelLayer = L.layerGroup();

function radius(e){
  if(e.mag>0){ return Math.min(14, 4 + Math.sqrt(e.mag)/18); }
  return e.tier===1 ? 5 : 4;
}
function checked(cls){
  return new Set([...document.querySelectorAll('input.'+cls+':checked')]
                 .map(i=>i.value));
}
function redraw(){
  evLayer.clearLayers(); labelLayer.clearLayers();
  if(!document.getElementById('showEvents').checked){
    document.getElementById('count').textContent = "events hidden (enable 'Show events')";
    return;
  }
  const fy=checked('fy'), ft=checked('ft'), fg=checked('fg'), fr=checked('fr');
  let n=0;
  EVENTS.forEach(e=>{
    if(!fy.has(e.year)||!ft.has(String(e.tier))||!fg.has(e.tg)||!fr.has(e.region)) return;
    n++;
    const col = COLORS[e.tg] || COLORS[e.type] || DEFCOL;
    const m = L.circleMarker([e.lat,e.lon],{radius:radius(e),color:col,
      weight:1,fillColor:col,fillOpacity:e.tier===1?0.85:0.45});
    m.bindPopup(`<b>${e.name}</b><br>${e.label}<br>
      type: ${e.type} · tier ${e.tier}<br>source: ${e.src}`);
    m.addTo(evLayer);
    if(e.ign && document.getElementById('showIgn').checked){
      L.polyline([[e.lat,e.lon],e.ign],{color:col,weight:1,dashArray:'3,3',opacity:.7}).addTo(evLayer);
      L.circleMarker(e.ign,{radius:3,color:'#111',weight:1.5,fillColor:'#fff',fillOpacity:1})
       .bindPopup(`<b>${e.name}</b><br>official ignition point (WFIGS)`).addTo(evLayer);
    }
    if(e.major && document.getElementById('showMajor').checked){
      L.marker([e.lat,e.lon],{opacity:0}).bindTooltip(e.label,
        {permanent:true,direction:'top',offset:[0,-6]}).addTo(labelLayer);
    }
  });
  document.getElementById('count').textContent = n + ' events shown';
}
document.querySelectorAll('#panel input').forEach(i=>i.addEventListener('change',()=>{
  if(document.getElementById('showSensors').checked){ map.addLayer(sensorLayer); }
  else { map.removeLayer(sensorLayer); }
  if(document.getElementById('showMajor').checked){ map.addLayer(labelLayer); }
  else { map.removeLayer(labelLayer); }
  redraw();
}));
redraw();
</script></body></html>
